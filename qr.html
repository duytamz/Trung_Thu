<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Tạo Mã QR</title>
  <script src="js/qrcode_bundle.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0e27;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }
    h2 { margin-bottom: 16px; color: #ffd700; }
    #qr-container {
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(255, 215, 0, 0.3);
    }
    .info {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #aaa;
      text-align: center;
      max-width: 400px;
    }
    .url-text {
      margin-top: 12px;
      padding: 10px 18px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      font-size: 0.85rem;
      color: #ffd700;
      word-break: break-all;
    }
    button {
      margin-top: 16px;
      padding: 12px 28px;
      border: none;
      border-radius: 24px;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 107, 139, 0.5);
    }
    button:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <h2>🏮 Mã QR Quà Tặng Trung Thu</h2>
  <div id="qr-container"></div>
  <div class="url-text" id="target-url"></div>
  <button onclick="downloadQR()">📥 Tải Ảnh QR</button>
  <div class="info">Quét mã QR trên Zalo/Camera điện thoại sẽ mở trang web quà tặng Trung Thu</div>

  <script>
    const targetURL = 'https://duytamz.github.io/Trung_Thu/';
    document.getElementById('target-url').textContent = targetURL;

    const qr = new QRCode(document.getElementById('qr-container'), {
      text: targetURL,
      width: 280,
      height: 280,
      colorDark: '#c0392b',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });

    function downloadQR() {
      const canvas = document.querySelector('#qr-container canvas');
      if (canvas) {
        const link = document.createElement('a');
        link.download = 'QR_TrungThu_QuaTang.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } else {
        const img = document.querySelector('#qr-container img');
        if (img) {
          const link = document.createElement('a');
          link.download = 'QR_TrungThu_QuaTang.png';
          link.href = img.src;
          link.click();
        }
      }
    }
  </script>
</body>
</html>
