<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Một Mùa Thương - Quà Tặng Trung Thu Tình Yêu</title>
  <meta name="description" content="Món quà Trung Thu lãng mạn dành riêng cho người yêu: Lồng đèn hoa ngôi sao 3D, hoa nhảy múa, vầng trăng rằm huyền ảo và bức thư tình đong đầy yêu thương." />
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/lantern.css" />
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏮</text></svg>" />
</head>
<body>
  <!-- Sky Canvas Background (Stars, Moon, Clouds, Fireflies, Floating Sky Lanterns & Water Ripples) -->
  <canvas id="sky-canvas"></canvas>

  <!-- QR Code Floating Link Button -->
  <a href="qr.html" class="qr-floating-pill" id="qr-link-btn" title="Lấy mã QR Quà Tặng">
    <span>📱</span> Mã QR
  </a>

  <!-- Audio Player Floating Pill -->
  <div class="audio-floating-pill" id="audio-player-pill" title="Bật/Tắt nhạc Trung Thu">
    <div class="audio-bars">
      <div class="audio-bar"></div>
      <div class="audio-bar"></div>
      <div class="audio-bar"></div>
      <div class="audio-bar"></div>
    </div>
    <span class="audio-label">Nhạc: Bật</span>
  </div>

  <!-- Flower Entrance Animation Container ("Hoa nhảy ra") -->
  <div class="flower-entrance-layer" id="flower-entrance-layer"></div>

  <!-- App Main Container -->
  <div class="app-container">
    <!-- Header Section -->
    <header class="header-section">
      <div class="sub-title">Một mùa thương</div>
      <h1 class="main-title">TRUNG THU</h1>
      <div class="lover-name-badge">
        <span>Gửi:</span>
        <strong id="lover-display-name">Em Bé Của Anh</strong>
        <span class="heart">❤️</span>
      </div>
    </header>

    <!-- Flying Danmaku Wishes Container -->
    <div class="danmaku-container" id="danmaku-container"></div>

    <!-- Center 3D Star Flower Lantern & Bear Stage -->
    <div class="lantern-stage" id="lantern-stage">
      <!-- Injected by js/lantern.js -->
    </div>

    <!-- Bottom Action Controls Bar (Dành riêng cho người yêu) -->
    <footer class="bottom-control-bar">
      <button class="btn-magic" id="open-letter-btn">
        <span>💌</span> Mở Bức Thư Tình
      </button>
      <button class="btn-magic" id="open-wish-modal-btn">
        <span>🏮</span> Viết Điều Ước Cùng Anh
      </button>
    </footer>
  </div>

  <!-- Love Letter & Memories Modal -->
  <div class="modal-overlay" id="love-letter-modal">
    <div class="modal-card">
      <button class="modal-close-btn" id="letter-close-btn">✕</button>
      
      <div class="letter-header">
        <h2 class="letter-title">Bức Thư Mùa Trăng</h2>
        <div class="letter-subtitle" id="letter-lover-name">Gửi Em Bé Của Anh 💕</div>
      </div>


      <!-- Polaroid Memory Photos Gallery -->
      <div class="polaroid-gallery" id="polaroid-gallery">
        <!-- Rendered by js/loveLetter.js -->
      </div>

      <!-- Love Letter Text -->
      <div class="letter-body" id="letter-body-text">
        <!-- Text rendered by js/loveLetter.js -->
      </div>

      <!-- Release Sky Lantern Wish Section -->
      <div class="wish-section">
        <div style="font-size: 0.92rem; font-weight: 600; color: var(--gold-warm);">
          🏮 Gửi điều ước lên cung trăng cùng anh:
        </div>
        <div class="wish-input-group">
          <input type="text" class="wish-input" id="wish-input" placeholder="Nhập điều ước của em..." maxlength="45" />
          <button class="btn-magic" id="send-wish-btn" style="padding: 8px 18px;">Thả Đèn</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Dedicated Lover's Wish Modal -->
  <div class="modal-overlay" id="wish-dialog-modal">
    <div class="modal-card" style="max-width: 440px;">
      <button class="modal-close-btn" id="wish-dialog-close-btn">✕</button>
      
      <div class="letter-header">
        <h2 class="letter-title" style="font-size: 2.4rem;">Điều Ước Mùa Trăng</h2>
        <div class="letter-subtitle">Gửi ngàn tâm tư lên vầng trăng rằm cùng anh ✨</div>
      </div>

      <div style="margin: 16px 0;">
        <label class="form-label">Điều ước của bé hôm nay là gì nè?</label>
        <textarea class="form-textarea" id="lover-wish-textarea" rows="4" placeholder="Ví dụ: Mong hai đứa luôn hạnh phúc bên nhau, bé thi tốt, anh luôn yêu chiều bé..."></textarea>
      </div>

      <button class="btn-magic" id="lover-submit-wish-btn" style="width: 100%; justify-content: center;">
        🏮 Thả Hoa Đăng Cầu Nguyện
      </button>
    </div>
  </div>

  <!-- Background Music Audio Element (TikTok Trending Audio) -->
  <audio id="bg-audio" preload="auto" loop src="assets/audio/trung_thu_trend.mp3"></audio>

  <!-- JavaScript ES6 Module Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
